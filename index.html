<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0b0f12" />
    <meta
      name="description"
      content="Private journeys through the Indonesian archipelago. Nine hours from anywhere worth leaving."
    />
    <title>Vela — Private Travel, Indonesian Archipelago</title>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- __SITE_URL__ is filled in at build time by the vela:site-urls plugin
         in vite.config.ts, from VITE_SITE_URL or Vercel's production domain. -->
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Vela — Private Travel" />
    <meta
      property="og:description"
      content="Private journeys through the Indonesian archipelago, planned by people who have slept in every room they sell."
    />
    <meta property="og:image" content="__SITE_URL__/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Warm the first hero frame for whichever set this device will load.
         The breakpoint mirrors IS_COMPACT in src/lib/frameLoader.ts. -->
    <link
      rel="preload"
      as="image"
      href="/frames/journey/frame_0001.webp"
      media="(min-width: 861px) and (pointer: fine)"
    />
    <link
      rel="preload"
      as="image"
      href="/frames/journey-mobile/frame_0001.webp"
      media="(max-width: 860px), (pointer: coarse)"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
